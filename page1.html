<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="email_styles.css">
</head>

<body>
    <form action="https://mudfoot.doc.stu.mmu.ac.uk/ash/api/mailinglist" method="post" class="email-submit">
        <label class="block" for="fname1">First Name:</label>
        <input class="block" type="text" data-field="firstName" />

        <label class="block" for="lname1">Surname:</label>
        <input class="block" type="text" data-field="lastName" />

        <label class="block" for="email1">Email:</label>
        <input class="block" type="email" data-field="email" />

        <button class="block" type="submit">Submit</button>
        <p class="block email-status"></p>
    </form>
    <script src="email.js"></script>
</body>

</html>
