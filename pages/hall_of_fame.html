<!DOCTYPE html>
<html>

<head>
  <title>Excision Fan Page - Hall of Fame</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles/index.css">
  <link rel="stylesheet" href="/styles/hall_of_fame.css">
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
</head>

<body>
  <header class="head separators">
    <a href="/index.html"><img class="logo" src="/assets/front_page_logo.png" /></a>
    <p class="exc-h1">Rock and Roll Hall of Fame</p>

    <div class="year-container">
      <p class="exc-h1">In the Year of</p>
      <p class="exc-h1" id="hall-of-fame-year"></p>
    </div>
  </header>
  
  <nav class="separators exc-nav">
    <button class="nav-button button-container" onclick="history.back()">
      <a class="exc-h3">Back</a>
    </button>
    <form action="/pages/hall_of_fame.html" class="button-container">
      <button class="nav-button" type="submit">
        <a class="exc-h3">Hall Of Fame</a>
      </button>
    </form>

    <form action="/pages/top_songs.html" class="button-container">
      <button class="nav-button">
        <a class="exc-h3">Top Songs</a>
      </button>
    </form>

    <form action="/pages/top_albums.html" class="button-container">
      <button class="nav-button">
        <a class="exc-h3">Top Albums</a>
      </button>
    </form>
  </nav>

  <main>
    <content class="year-choose-content">
      <div class="choose-year">
        <label class="block exc-text">Choose a Year:</label>
        <select name="hof-year" id="hof-year" disabled="true"></select>

        <button onclick="load_new_year()">Refresh</button>
        <p class="block email-status"></p>
      </div>
    </content>
    <script src="/scripts/hall_of_fame.js"></script>
    <div id="hall-of-fame-content" class="hall-of-fame-content-container">
    </div>
  </main>

  <footer>
    <p class="big exc-text">&copy; 2026 Introduction to Web Development Assignment</p>
    <p class="small exc-text">Trademarked by absolutely no one</p>
  </footer>
</body>

</html>
