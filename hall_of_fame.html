<!DOCTYPE html>
<html>

<head>
  <title>Excision Fan Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="hall_of_fame.css">
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
</head>

<body>
  <header class="exc-head exc-separators">
    <a href="index.html"><img class="exc-logo" src="front_page_logo.png" /></a>
    <p class="exc-h1">Rock and Roll Hall of Fame</p>

    <div class="year-container">
      <p class="exc-h1">In the Year of</p>
      <p class="exc-h1" id="hall-of-fame-year"></p>
    </div>
  </header>
  
  <nav class="exc-separators exc-nav">
    <button class="nav-button button-container" onclick="history.back()">
      <a class="exc-h3">Back</a>
    </button>
    <form action="hall_of_fame.html" class="button-container">
      <button class="nav-button" type="submit">
        <a class="exc-h3">Hall Of Fame</a>
      </button>
    </form>

    <form action="top_songs.html" class="button-container">
      <button class="nav-button">
        <a class="exc-h3">Top Songs</a>
      </button>
    </form>

    <form action="top_albums.html" class="button-container">
      <button class="nav-button">
        <a class="exc-h3">Top Albums</a>
      </button>
    </form>
  </nav>

  <main>
    <script src="hall_of_fame.js"></script>
    <div id="hall-of-fame-content" class="hall-of-fame-content-container">
    </div>
  </main>

  <footer>
    <p class="big exc-text">&copy; 2026 Introduction to Web Development Assignment</p>
    <p class="small exc-text">Trademarked by absolutely no one</p>
  </footer>
</body>

</html>
